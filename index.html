<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Salary Manager</h1>
        
        <!-- Salary Input -->
        <div class="section">
            <label>Set Total Salary:</label>
            <input type="number" id="totalSalary" placeholder="e.g. 3000">
            <button onclick="setSalary()">Set Salary</button>
        </div>

        <hr>

        <!-- Expense Input -->
        <div class="section">
            <h3>Add Expense</h3>
            <input type="text" id="desc" placeholder="What did you buy?">
            <input type="number" id="amount" placeholder="Amount">
            <input type="date" id="date">
            <button onclick="addExpense()">Add Expense</button>
        </div>

        <!-- Dashboard -->
        <div class="dashboard">
            <h2>Balance: ₹<span id="balance">0</span></h2>
        </div>

        <!-- History Table -->
        <table id="expenseTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="expenseList">
                <!-- Rows will be added here by JS -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
